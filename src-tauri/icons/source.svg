<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1535"/>
      <stop offset="1" stop-color="#0d0b1a"/>
    </linearGradient>
    <linearGradient id="m" gradientUnits="userSpaceOnUse" x1="200" y1="760" x2="824" y2="300">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.55" stop-color="#c026d3"/>
      <stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- fundo -->
  <rect x="64" y="64" width="896" height="896" rx="220" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="220" fill="url(#glow)"/>

  <!-- onda de áudio atravessando (o som que entra) -->
  <path d="M120 512 C 180 512, 180 430, 240 430 S 300 594, 360 594 S 420 430, 480 430 S 540 594, 600 594 S 660 430, 720 430 S 780 594, 840 594 S 880 512, 904 512"
        fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="30" stroke-linecap="round"/>

  <!-- o M de Musix, traçado como um sinal: os picos são a letra -->
  <path d="M232 744 L232 318 L512 598 L792 318 L792 744"
        fill="none" stroke="url(#m)" stroke-width="118" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- vazio no centro: a "voz" que o efeito retira -->
  <circle cx="512" cy="598" r="92" fill="url(#bg)"/>
  <circle cx="512" cy="598" r="52" fill="#ffffff"/>
</svg>
